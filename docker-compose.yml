services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flight_ops
      POSTGRES_USER: flight_app
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "5433:5432"
    volumes:
      - flight_ops_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight_app -d flight_ops"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  flight_ops_postgres:
